
spring.application.name=backend

spring.datasource.url=jdbc:sqlserver://rrm-usv-server-2026.database.windows.net:1433;databaseName=rrm_db;encrypt=true;trustServerCertificate=false;loginTimeout=60
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Autentificare: dev = simulator de roluri (header X-User-Id); sso = gateway SSO/LDAP al universitatii ---
app.auth.mode=${APP_AUTH_MODE:dev}
app.auth.email-header=${APP_AUTH_EMAIL_HEADER:X-Auth-Request-Email}
app.auth.name-header=${APP_AUTH_NAME_HEADER:X-Auth-Request-User}

# --- Notificari e-mail (confirmare, aprobare, anulare, reminder) ---
# Pentru trimiterea efectiva trebuie configurat si serverul SMTP.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@usv.ro}
app.reminders.hours-before=${APP_REMINDER_HOURS:24}
